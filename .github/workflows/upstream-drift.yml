name: upstream-drift

on:
  schedule:
    - cron: '0 14 * * 1'   # Monday 14:00 UTC
  workflow_dispatch:        # manual trigger

permissions:
  contents: write           # create branch
  pull-requests: write      # open PR

jobs:
  detect:
    runs-on: ubuntu-latest
    # Serialize per-vendor so the cron + a manual workflow_dispatch on the
    # same day can't both create + push chore/upstream-drift-<vendor>-<DATE>.
    concurrency:
      group: upstream-drift-${{ matrix.vendor }}
      cancel-in-progress: false
    strategy:
      matrix:
        vendor: [claude, codex, cursor]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      # Build testagent for validator dispatch.
      - run: go build -o /tmp/testagent .

      # Run the drift skill for this vendor (shell-script form;
      # the skill itself is the canonical workflow but the GHA
      # invocation needs concrete bash steps).
      - name: Detect drift for ${{ matrix.vendor }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/upstream-drift.sh ${{ matrix.vendor }}
